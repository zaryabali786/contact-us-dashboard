<div class="dashboard-wrapper">
  <main class="dashboard-card" [class.mobile-detail-active]="isMobileDetailOpen()">
    <!-- Master Contact List Pane -->
    <aside class="pane-list" [class.hidden-on-mobile]="isMobileDetailOpen()">
      <app-contact-list></app-contact-list>
    </aside>

    <!-- Detail Profile Pane -->
    <section class="pane-detail" [class.visible-on-mobile]="isMobileDetailOpen()">
      <app-contact-details (back)="onBackToList()"></app-contact-details>
    </section>
  </main>
</div>
